<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- turtle glyph, centered with generous safe-zone for maskable -->
  <g fill="none" stroke="#ecfdf5" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- shell -->
    <ellipse cx="256" cy="266" rx="120" ry="92"/>
    <!-- shell segments -->
    <path d="M256 174 V358"/>
    <path d="M150 240 H362"/>
    <path d="M150 292 H362"/>
    <!-- head -->
    <circle cx="256" cy="150" r="34" fill="#ecfdf5" stroke="none"/>
    <!-- legs -->
    <path d="M168 340 l-34 36"/>
    <path d="M344 340 l34 36"/>
  </g>
</svg>
